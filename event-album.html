<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Лендинг QR-альбомов живёт на /. GitHub Pages не умеет серверных
     редиректов, поэтому тут мгновенный переход: скрипт сохраняет #якорь и
     ?параметры (например, #buy), meta refresh — запасной путь без JS.
     canonical + noindex склеивают старый адрес с новым в поисковиках. -->
<title>Event Albums — Albums</title>
<link rel="canonical" href="https://albums.ink/">
<meta name="robots" content="noindex,follow">
<meta http-equiv="refresh" content="0; url=/">
<script>location.replace('/' + location.search + location.hash);</script>
</head>
<body>
<p>This page has moved to <a href="/">albums.ink</a>.</p>
</body>
</html>
