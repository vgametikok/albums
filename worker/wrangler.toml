# Worker перед GitHub Pages. Отдельно от ../wrangler.jsonc (тот — для режима
# «сайт целиком на Cloudflare» со статикой из dist/, сейчас не используется).
# Деплой: cd worker && npx wrangler deploy
name = "albums-edge"
main = "edge.js"
compatibility_date = "2026-10-01"
account_id = "96b91534a2f6087bc76e5a279febc1a8"
workers_dev = false
# Только нужные пути: остальная статика идёт в Pages мимо Worker'а и не
# тратит лимит бесплатного тарифа (100 000 запросов в сутки).
routes = [
  { pattern = "albums.ink/", zone_name = "albums.ink" },
  { pattern = "albums.ink/index.html", zone_name = "albums.ink" },
  { pattern = "albums.ink/album.html*", zone_name = "albums.ink" },
  { pattern = "albums.ink/profile.html*", zone_name = "albums.ink" },
  { pattern = "albums.ink/og/*", zone_name = "albums.ink" },
  { pattern = "albums.ink/sitemap.xml", zone_name = "albums.ink" },
  { pattern = "albums.ink/a/*", zone_name = "albums.ink" },
  { pattern = "albums.ink/u/*", zone_name = "albums.ink" },
  { pattern = "albums.ink/guides/birthday-party-photo-sharing-qr-code*", zone_name = "albums.ink" },
  { pattern = "albums.ink/guides/how-to-make-qr-code-for-photo-sharing*", zone_name = "albums.ink" },
  { pattern = "albums.ink/guides/corporate-event-photo-sharing*", zone_name = "albums.ink" },
  { pattern = "albums.ink/guides/baby-shower-photo-sharing*", zone_name = "albums.ink" },
  { pattern = "albums.ink/guides/family-reunion-photo-sharing*", zone_name = "albums.ink" },
  { pattern = "albums.ink/guides/graduation-party-photo-sharing*", zone_name = "albums.ink" },
  { pattern = "albums.ink/guides/memorial-service-photo-collection*", zone_name = "albums.ink" },
  { pattern = "albums.ink/guides/bachelorette-party-photo-sharing*", zone_name = "albums.ink" },
  { pattern = "albums.ink/guides/anniversary-party-photo-sharing*", zone_name = "albums.ink" },
  { pattern = "albums.ink/guides/class-reunion-photo-sharing*", zone_name = "albums.ink" },
]
[observability]
enabled = true
