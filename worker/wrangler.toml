# Worker перед GitHub Pages. Отдельно от ../wrangler.jsonc (тот — для режима
# «сайт целиком на Cloudflare» со статикой из dist/, сейчас не используется).
# Деплой: cd worker && npx wrangler deploy
name = "albums-edge"
main = "edge.js"
compatibility_date = "2026-10-01"
account_id = "96b91534a2f6087bc76e5a279febc1a8"
workers_dev = false
routes = [
  { pattern = "albums.ink/*", zone_name = "albums.ink" },
]
[observability]
enabled = true
