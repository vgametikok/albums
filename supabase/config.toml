# Минимальный конфиг Supabase CLI — только настройки edge-функций.
# Все функции проекта работают с verify_jwt = false (каждая проверяет доступ
# сама: apikey-гейт, подпись вебхука и т.п.). Записаны все, чтобы деплой через
# `npx.cmd supabase functions deploy <имя>` не включил проверку JWT по умолчанию.
project_id = "rizveurkjpcwrmbtoawj"

[functions.paddle-webhook]
