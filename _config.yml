# Конфиг сборки Jekyll — и это НАСТОЯЩИЙ список исключений боевого сайта.
#
# Проверено 2026-09-01 запросами к albums.ink: закрыто ровно то, что
# перечислено здесь, а не то, что перечислено в SKIP внутри build.mjs.
# То есть albums.ink собирается Jekyll по этому файлу; `node build.mjs`
# в облаке не выполняется вовсе (подробности — в README).
#
# `exclude` — что остаётся в репозитории, но НЕ публикуется на albums.ink.
# Нужно, чтобы схема БД, RLS-политики, деплой-скрипты и README не отдавались
# краулерам: они путают поисковики и нейросети и раскрывают внутреннее устройство.
#
# Внимание: список полностью заменяет дефолтный exclude Jekyll, поэтому
# node_modules/vendor/Gemfile перечислены явно.
exclude:
  - supabase
  - tools
  - internal
  - Design            # макеты редизайна
  - dist              # результат локальной сборки
  - serve.js
  - build.mjs         # сам скрипт сборки отдавался наружу до 2026-09-01
  - README.md
  - _config.yml
  - .gitignore
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
